name: build-and-deploy
# Publishes the docs.moondao.com redirect site.
# The Quartz documentation site is deprecated; pages redirect to
# https://moondao.com/docs (path-preserving where the old URL is known).
on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch: {}
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@main
      - name: Build redirect site
        run: python3 scripts/build_redirect_site.py --out site
      - name: Check redirect site
        run: python3 scripts/test_redirect_site.py site
      - name: Cache site
        uses: actions/upload-artifact@main
        with:
          name: site
          path: site
  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@main
      - uses: actions/download-artifact@main
        with:
          name: site
          path: site
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@main
        with:
          path: site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@main
        if: github.event_name != 'pull_request'
